name: daily-sync

on:
  schedule:
    - cron: "0 1 * * *"   # 每日 UTC 01:00 = 北京时间 09:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r server/requirements.txt

      # CI 中不配置 LLM_API_KEY：仅执行 CCFDDL 结构化同步（无外部密钥依赖）
      - name: Run sync
        run: python server/sync.py

      - name: Commit if changed
        run: |
          git config user.name  "venue-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/venues.json
          if git diff --cached --quiet; then
            echo "No deadline changes today."
          else
            git commit -m "chore(sync): refresh deadlines $(date -u +'%F %T')"
            git push
          fi
